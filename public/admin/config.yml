backend:
  name: github
  repo: dangphucprnt/truth-blog
  branch: main
  base_url: https://decap-oauth.dangphucfb.workers.dev
  auth_endpoint: /auth

media_folder: "public/blog-assets"
public_folder: "/blog-assets"

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "blog"
    label: "Bài Viết"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Chuyên mục"
        name: "category"
        widget: "select"
        default: "auto"
        required: false
        options:
          - { label: "Tự nhận diện", value: "auto" }
          - { label: "iPhone - Công nghệ", value: "iphone-cong-nghe" }
          - { label: "Cà Phê", value: "ca-phe" }
          - { label: "3D Tech", value: "3d-tech" }
          - { label: "Xã Hội", value: "xa-hoi" }
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Mô tả ngắn", name: "description", widget: "string" }
      - { label: "Ngày xuất bản", name: "pubDate", widget: "datetime" }
      - { label: "Ảnh đại diện", name: "heroImage", widget: "image", required: false }
      - { label: "Mô tả ảnh đại diện", name: "heroAlt", widget: "string", required: false }
      - { label: "Chú thích dưới ảnh", name: "heroCaption", widget: "string", required: false }
      - { label: "Nội dung bài viết", name: "body", widget: "markdown" }